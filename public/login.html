<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12100e" />
    <title>Lamplink</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="centered">
    <main class="login">
      <svg class="lamp-icon big" viewBox="0 0 64 64" aria-hidden="true">
        <path class="shade" d="M32 6 L52 30 H12 Z" />
        <line class="cord" x1="32" y1="30" x2="32" y2="44" />
        <ellipse class="bulb" cx="32" cy="50" rx="8" ry="9" />
      </svg>
      <h1>Lamplink</h1>
      <p>You need your personal link to get in. It looks like:</p>
      <code>https://this-site/?t=your-token</code>
      <p class="muted">
        Ask whoever set this up to send you yours, then bookmark it or add it to your home screen.
      </p>
    </main>
  </body>
